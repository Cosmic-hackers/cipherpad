<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Open Note — CipherPad</title>
  <meta name="description" content="Enter your password to decrypt and open your private CipherPad note."/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23FF5E1F'/><path d='M16 7a5 5 0 0 0-5 5v2H9a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-2v-2a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v2h-6v-2a3 3 0 0 1 3-3zm0 7a2 2 0 1 1 0 4 2 2 0 0 1 0-4z' fill='white'/></svg>"/>
  <style>
    /* ── Open-page specific styles ──────────────────────── */
    .open-screen {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: var(--bg-warm);
    }

    .open-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
      width: 100%;
      max-width: 420px;
      padding: 48px 44px;
    }

    .open-card-icon {
      width: 56px; height: 56px;
      background: var(--orange-soft);
      border: 1px solid var(--orange-mid);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--orange);
      margin: 0 auto 24px;
    }

    .open-card-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -.03em;
      text-align: center;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.1;
    }

    .open-card-desc {
      font-size: .88rem;
      color: var(--text-sec);
      text-align: center;
      line-height: 1.65;
      margin-bottom: 32px;
    }

    .open-error {
      display: none;
      align-items: flex-start;
      gap: 8px;
      background: rgba(198,83,83,.07);
      border: 1px solid rgba(198,83,83,.25);
      border-radius: var(--radius);
      padding: 11px 14px;
      font-size: .85rem;
      color: var(--error);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .open-error svg { flex-shrink: 0; margin-top: 1px; }

    .open-unlock-btn {
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }

    .open-footer-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: .82rem;
      color: var(--text-muted);
    }
    .open-footer-link a {
      color: var(--orange);
      font-weight: 600;
    }
    .open-footer-link a:hover { text-decoration: underline; }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      .open-card {
        padding: 36px 24px;
        border-radius: 12px;
      }
      .open-card-title { font-size: 1.4rem; }
    }
    @media (max-width: 360px) {
      .open-card { padding: 28px 18px; }
    }
  </style>
</head>
<body>

<!-- Preloader -->
<div id="preloader">
  <div class="preloader-logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    CipherPad
  </div>
  <div class="preloader-bar"><div class="preloader-fill"></div></div>
</div>

<!-- Navbar -->
<nav class="navbar">
  <div class="container">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <div class="nav-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        CipherPad
      </a>
      <div class="nav-actions">
        <a href="/" class="nav-btn-open">Home</a>
        <a href="/create.html" class="btn-primary">New Note</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobileNav">
    <a href="/">Home</a>
    <a href="/create.html" class="btn-primary">New Note</a>
  </nav>
</nav>

<!-- Unlock card -->
<div class="open-screen">
  <div class="open-card">

    <!-- Icon -->
    <div class="open-card-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <!-- Heading -->
    <h1 id="openTitle" class="open-card-title">Enter your<br>password.</h1>
    <p id="openDesc" class="open-card-desc">This note is encrypted. Enter the password to decrypt and open it.</p>

    <!-- Error -->
    <div id="unlockError" class="open-error">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="unlockErrorText"></span>
    </div>

    <!-- Form -->
    <form id="openForm" novalidate>
      <!-- Hidden: keeps token/id available to JS without showing in UI -->
      <input id="noteLink" type="hidden"/>

      <div class="form-group">
        <label class="form-label" for="unlockPassword">Decryption password</label>
        <div class="input-wrap has-toggle">
          <input
            id="unlockPassword"
            type="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
            autofocus
          />
          <button type="button" class="toggle-password" data-target="unlockPassword" aria-label="Show / hide password">
            <svg class="eye-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="unlockBtn" class="btn-primary btn-lg open-unlock-btn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
        </svg>
        Unlock Note
      </button>
    </form>

    <span class="open-footer-link">
      Don't have a note? <a href="/create.html">Create one →</a>
    </span>

  </div>
</div>

<div id="toastContainer"></div>

<script src="/js/crypto.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/open.js"></script>
<script>
  window.addEventListener('load', () => setTimeout(() => document.getElementById('preloader').classList.add('hidden'), 900));
  document.getElementById('hamburger').addEventListener('click', () => document.getElementById('mobileNav').classList.toggle('open'));
</script>
</body>
</html>
