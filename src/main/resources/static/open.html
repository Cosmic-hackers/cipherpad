<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Open Note — CipherPad</title>
  <meta name="description" content="Open and unlock your encrypted note."/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>"/>
</head>
<body class="page-centered">

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      CipherPad
    </a>
    <div class="navbar-actions">
      <a href="/create.html" class="btn btn-primary btn-sm">New Note</a>
    </div>
  </div>
</nav>

<main>
  <div class="form-card">
    <div class="form-card-header">
      <div class="form-card-icon">🔓</div>
      <h1 class="form-card-title">Unlock Your Note</h1>
      <p class="form-card-subtitle">Enter your note's access link and the password you used to encrypt it.</p>
    </div>

    <!-- Pre-filled from URL fragment if shared link -->
    <div class="unlock-info" id="sharedLinkInfo" style="display:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:.1rem;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span>A shared note link was detected. Enter the password to decrypt it.</span>
    </div>

    <form id="openForm" class="form-stack" novalidate>
      <!-- Note ID or Link -->
      <div class="form-group" id="linkGroup">
        <label class="form-label" for="noteLink">Note ID or Shared Link</label>
        <input
          type="text"
          id="noteLink"
          name="noteLink"
          class="form-input"
          placeholder="Paste your note link or ID here"
          autocomplete="off"
        />
        <span class="form-hint">Your share link looks like: <code style="font-size:.78rem; color:var(--primary);">https://cipherpad.app/editor.html#id=...&token=...</code></span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="unlockPassword">Decryption Password <span style="color:var(--error);">*</span></label>
        <div class="input-wrapper">
          <input
            type="password"
            id="unlockPassword"
            name="unlockPassword"
            class="form-input"
            placeholder="Enter the encryption password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-password" data-target="unlockPassword" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Error -->
      <div id="unlockError" class="alert alert-error hidden" role="alert"></div>

      <!-- Submit -->
      <button type="submit" id="unlockBtn" class="btn btn-primary btn-lg" style="width:100%;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
        Unlock Note
      </button>

      <p style="text-align:center; font-size:.875rem; color:var(--text-muted);">
        Don't have a note yet?
        <a href="/create.html" style="color:var(--primary); font-weight:600;">Create one →</a>
      </p>
    </form>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/app.js"></script>
<script src="/js/open.js"></script>
</body>
</html>
