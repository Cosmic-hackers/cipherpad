<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Open Note — CipherPad</title>
  <meta name="description" content="Access and decrypt your private CipherPad note."/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23FF5E1F'/><path d='M16 7a5 5 0 0 0-5 5v2H9a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-2v-2a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v2h-6v-2a3 3 0 0 1 3-3zm0 7a2 2 0 1 1 0 4 2 2 0 0 1 0-4z' fill='white'/></svg>"/>
</head>
<body>

<!-- Preloader -->
<div id="preloader">
  <div class="preloader-logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    CipherPad
  </div>
  <div class="preloader-bar"><div class="preloader-fill"></div></div>
</div>

<!-- Navbar -->
<nav class="navbar">
  <div class="container">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <div class="nav-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        CipherPad
      </a>
      <div class="nav-actions">
        <a href="/create.html" class="btn-primary">New Note</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobileNav">
    <a href="/">Home</a>
    <a href="/create.html" class="btn-primary">New Note</a>
  </nav>
</nav>

<!-- Page body -->
<div class="page-wrap open-page">
  <div class="container">
    <div class="open-wrap">

      <!-- Left: Form -->
      <div>
        <div id="pageEyebrow" class="page-eyebrow">Access note</div>
        <h1 id="pageTitle" class="page-title">Access your<br>private note.</h1>
        <p id="pageDesc" class="page-desc">Paste your share link or note ID, then enter the decryption password to unlock.</p>

        <div class="form-card">
          <form id="openForm" novalidate>

            <div class="form-group" id="linkGroup">
              <label class="form-label" for="noteLink">Note link or ID</label>
              <input id="noteLink" type="text" class="form-input" placeholder="https://…/editor.html#id=…&token=… or UUID" autocomplete="off"/>
            </div>

            <div class="form-group">
              <label class="form-label" for="unlockPassword">Decryption password <span style="color:var(--error)">*</span></label>
              <div class="input-wrap has-toggle">
                <input id="unlockPassword" type="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required/>
                <button type="button" class="toggle-password" data-target="unlockPassword" aria-label="Show/hide password">
                  <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div id="unlockError" class="field-error hidden" style="margin-bottom:16px;padding:11px 14px;background:rgba(198,83,83,.07);border:1px solid rgba(198,83,83,.25);border-radius:var(--radius);display:none;align-items:flex-start;gap:7px;font-size:.875rem;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <span id="unlockErrorText"></span>
            </div>

            <button type="submit" id="unlockBtn" class="btn-primary btn-lg" style="width:100%;justify-content:center">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
              </svg>
              Unlock Note
            </button>

          </form>
        </div>

        <p id="hintText" style="font-size:.8rem;color:var(--text-muted);margin-top:16px;line-height:1.6;">
          Need the full share link? Ask the note creator to send you the link including the <code style="background:var(--bg-warm);padding:1px 5px;border-radius:4px;font-size:.78rem">#id=…&amp;token=…</code> fragment.
        </p>
      </div>

      <!-- Right: Illustration -->
      <div class="open-art" aria-hidden="true">
        <svg viewBox="0 0 320 360" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="160" cy="180" r="130" fill="#FFF0E8"/>
          <!-- document -->
          <rect x="80" y="80" width="160" height="200" rx="12" fill="white" stroke="#E8E8E8" stroke-width="1.5"/>
          <rect x="100" y="105" width="120" height="8" rx="4" fill="#F0F0F0"/>
          <rect x="100" y="123" width="90"  height="6" rx="3" fill="#F5F5F5"/>
          <rect x="100" y="139" width="110" height="6" rx="3" fill="#F5F5F5"/>
          <!-- encrypted lines -->
          <rect x="100" y="163" width="120" height="6" rx="3" fill="#FFD8C4"/>
          <rect x="100" y="177" width="85"  height="6" rx="3" fill="#FFD8C4"/>
          <rect x="100" y="191" width="100" height="6" rx="3" fill="#FFD8C4"/>
          <rect x="100" y="205" width="70"  height="6" rx="3" fill="#FFD8C4"/>
          <!-- lock badge -->
          <circle cx="160" cy="250" r="30" fill="white" stroke="#E8E8E8" stroke-width="1.5"/>
          <path d="M160 232c0 0 16-6 16 6v10c0 10-16 18-16 18s-16-8-16-18v-10c0-12 16-6 16-6z" fill="none" stroke="#FF5E1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="156" y="246" width="8" height="6" rx="1.5" fill="#FF5E1F"/>
          <path d="M157.5 246v-2.5a2.5 2.5 0 0 1 5 0v2.5" stroke="#FF5E1F" stroke-width="1.5" stroke-linecap="round"/>
          <!-- key -->
          <circle cx="96" cy="316" r="9" fill="none" stroke="#FF5E1F" stroke-width="2"/>
          <line x1="102" y1="310" x2="118" y2="326" stroke="#FF5E1F" stroke-width="2" stroke-linecap="round"/>
          <line x1="115" y1="323" x2="115" y2="329" stroke="#FF5E1F" stroke-width="2" stroke-linecap="round"/>
          <line x1="111" y1="327" x2="111" y2="332" stroke="#FF5E1F" stroke-width="2" stroke-linecap="round"/>
          <!-- dots -->
          <circle cx="52"  cy="100" r="5" fill="#FF5E1F" opacity=".3"/>
          <circle cx="268" cy="260" r="5" fill="#FF5E1F" opacity=".3"/>
          <circle cx="264" cy="100" r="4" fill="#FF5E1F" opacity=".2"/>
        </svg>
      </div>

    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script src="/js/crypto.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/open.js"></script>
<script>
  window.addEventListener('load', () => setTimeout(() => document.getElementById('preloader').classList.add('hidden'), 900));
  document.getElementById('hamburger').addEventListener('click', () => document.getElementById('mobileNav').classList.toggle('open'));
</script>
</body>
</html>
