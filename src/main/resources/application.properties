# Default / common properties
spring.application.name=CipherPad
server.port=${PORT:8080}

# Max request size for large encrypted notes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.mvc.pathmatch.use-suffix-pattern=false

# Logging - never log sensitive data
logging.level.com.cipherpad=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Suppress open-in-view warning
spring.jpa.open-in-view=false

# Default to local profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
